apiVersion: apps/v1
kind: Deployment
metadata:
  name: lfb
  namespace: production
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lfb
  template:
    metadata:
      labels:
        app: lfb
    spec:
      containers:
      - name: lfb
        image: IMAGE_PLACEHOLDER
        ports:
        - containerPort: 5000
        imagePullPolicy: Always
        # Readiness probe (controls rollout success)
        readinessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 2
          failureThreshold: 3

        # Liveness probe (restarts container if dead)
        livenessProbe:
          httpGet:
            path: /api/health
            port: 5000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 2
          failureThreshold: 3
