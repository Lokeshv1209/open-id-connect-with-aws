name: Build and Push Docker Image to ECR

on:
  push:
    branches:
      - '*'    # Trigger on all branches
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      id-token: write        # Required for OIDC
      contents: read        # Required to checkout repo

    steps:
      # 1️⃣ Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Configure AWS credentials via OIDC
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: arn:aws:iam::202279973546:role/GitHubActions-ECR-Push
          aws-region: ap-south-1  # Change to your AWS region

      # 3️⃣ Login to ECR
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # 4️⃣ Build Docker image
      - name: Build Docker image
        run: |
          IMAGE_TAG=${GITHUB_SHA::8} # Use first 8 chars of commit SHA
          IMAGE_NAME=123456789012.dkr.ecr.ap-south-1.amazonaws.com/frontend-web:${IMAGE_TAG}
          docker build -t $IMAGE_NAME .
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV

      # 5️⃣ Push Docker image to ECR
      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME

      # 6️⃣ Optional: tag latest for main branch
      - name: Tag latest on main
        if: github.ref == 'refs/heads/main'
        run: |
          docker tag $IMAGE_NAME 123456789012.dkr.ecr.ap-south-1.amazonaws.com/frontend-web:latest
          docker push 123456789012.dkr.ecr.ap-south-1.amazonaws.com/frontend-web:latest
